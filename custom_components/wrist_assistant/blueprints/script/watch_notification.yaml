blueprint:
  name: "Watch Notification"
  author: "Wrist Assistant"
  homeassistant:
    min_version: "2024.8.0"
  source_url: "https://github.com/NylonDiamond/homeassistant-wrist-assistant/blob/main/blueprints/script/wrist_assistant/watch_notification.yaml"
  description: >
    Send push notifications to your Apple Watch with smart entity
    buttons. Pick up to 4 entities — each becomes a button that
    knows how to control itself:

    - Lights, switches, fans, covers: tap to toggle

    - Locks, alarms: hold to confirm

    - Lights, covers, fans, climate: double-tap for presets

    Leave button slots empty to skip them. A notification with no
    buttons shows as info-only (title + message).


    **Important:** Notifications must be enabled on your Apple Watch.
    On your watch, go to Settings → Notifications → Wrist Assistant
    and make sure notifications are turned on. If you denied the
    permission prompt on first launch, notifications will not arrive
    until you enable them here.
  domain: script
  input:
    target:
      name: Target Watch
      description: >
        Watch to send to. Leave empty to send to all registered watches.
      default: ""
      selector:
        device:
          filter:
            - integration: wrist_assistant
              model: Apple Watch
    title:
      name: Title
      description: Optional title displayed above the message.
      default: ""
      selector:
        text:
    message:
      name: Message
      description: Notification body text.
      selector:
        text:
          multiline: true
    section_button_1:
      name: "☝️ Button 1"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_1_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_1_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:

    section_button_2:
      name: "☝️ Button 2"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_2_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_2_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:

    section_button_3:
      name: "☝️ Button 3"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_3_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_3_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:

    section_button_4:
      name: "☝️ Button 4"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_4_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_4_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:

    section_settings:
      name: "⚙️ Settings"
      icon: mdi:cog
      collapsed: true
      input:
        auto_dismiss:
          name: Auto-Dismiss
          description: >
            Dismiss the notification automatically after any button tap
            succeeds. When off (default), the notification stays visible
            with a checkmark on the tapped button.
          default: false
          selector:
            boolean:
        priority:
          name: Priority
          description: >
            Interruption level. Passive delivers silently, Active is the
            default, Time Sensitive breaks through Focus/DND, Critical
            overrides mute.
          default: "active"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Passive (silent delivery)"
                  value: "passive"
                - label: "Active (default)"
                  value: "active"
                - label: "Time Sensitive (breaks Focus)"
                  value: "time-sensitive"
                - label: "Critical (overrides mute)"
                  value: "critical"
        sound:
          name: Sound
          description: >
            Pick a preset or type a custom sound file name. Preview
            and browse all available sounds in the Wrist Assistant
            iOS app under Settings → Notification Style →
            Notification Sound.
          default: "default"
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Default sound"
                  value: "default"
                - label: "Silent"
                  value: ""
                # — Longer / Melodic —
