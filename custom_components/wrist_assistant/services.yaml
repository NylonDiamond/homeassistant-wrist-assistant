force_resync:
  name: Force resync
  description: >-
    Clear all watch sessions, forcing every connected watch to perform
    a full state refresh on its next poll.
  fields: {}

send_notification:
  name: Send notification
  description: >-
    Send a notification to every paired watch, or to one watch or iPhone.
    For the easy way, with buttons and a camera snapshot picked from lists,
    make a script from the bundled Watch Notification blueprint (Settings,
    Automations & scenes, Blueprints). A device can get notifications after
    it is paired and the app on it has been opened once.
  fields:
    message:
      name: Message
      description: >-
        Notification body text. Optional when you set a title or an image.
      example: "Front door was opened"
      selector:
        text:
    title:
      name: Title
      description: Optional notification title.
      example: "Door Alert"
      selector:
        text:
    target:
      name: Target
      description: >-
        Watch or iPhone to send to. Omit to send to all registered watches.
      selector:
        device:
          filter:
            - integration: wrist_assistant
              model: Apple Watch
            - integration: wrist_assistant
              model: iPhone
    actions:
      name: Actions
      description: >-
        List of entity action buttons (1-4) shown on the notification.
        Each action names an entity_id, and the watch picks the right
        action for the entity's domain and state.
        The server enriches each action with the entity's current state
        and attributes before sending. Optional keys: label (custom
        button text, defaults to friendly_name), icon (SF Symbol name),
        confirm (true = hold to confirm), expanded (true = open the
        button's quick controls without a double tap).
        Example: [{entity_id: "lock.front_door", icon: "lock.fill"},
        {entity_id: "light.porch", label: "Porch", icon: "lightbulb.fill"}]
      selector:
        object:
    image:
      name: Image (camera or image entity)
      description: >-
        Camera or image entity to snapshot and show in the notification (for
        example a doorbell camera, or a 3D printer's job snapshot). The frame is
        captured when the notification is sent. Tapping a camera snapshot opens
        the camera's live view; an image entity shows the still only. Away from
        home, the snapshot loads only with remote access (Home Assistant Cloud
        or an external URL).
      example: "camera.front_door"
      selector:
        entity:
          filter:
            - domain:
                - camera
                - image
    snapshot_width:
      name: Snapshot max width
      description: >-
        Max width (px) of the camera snapshot; the image is scaled to fit,
        preserving aspect. Smaller renders faster on the watch and over
        cellular. Only applies when "image" is set. Clamped to 256-1024; omit
        for the default (1024).
      example: 720
      selector:
        number:
          min: 256
          max: 1024
          step: 16
          unit_of_measurement: px
          mode: slider
    snapshot_quality:
      name: Snapshot JPEG quality
      description: >-
        JPEG quality of the camera snapshot (higher is sharper but larger).
        Only applies when "image" is set. Clamped to 40-90; omit for the
        default (80).
      example: 75
      selector:
        number:
          min: 40
          max: 90
          step: 5
          mode: slider
    data:
      name: Data
      description: >-
        Extra keys passed to the app. Known keys: auto_dismiss (true to
        dismiss after a button tap), subtitle (text below the message),
        entity_state (state text below the message), show_state (false to
        hide entity_state), live_stream and live_stream_watch (false to keep
        a camera snapshot still instead of playing live on the iPhone or the
        watch).
      selector:
        object:
    sound:
      name: Sound
      description: >-
        Sound to play. Pick one, or type a custom file name. Silent and
        custom sounds apply only with Reliable delivery; with Fast delivery
        the watch always plays its default alert.
      example: "default"
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - label: "Default sound"
              value: "default"
            - label: "Silent"
              value: ""
            - label: "Access Allowed"
              value: "Access-Allowed.caf"
            - label: "Arabian Harp"
              value: "Arabian-Harp.caf"
            - label: "ATM Keypress"
              value: "ATM-Keypress.caf"
            - label: "Bell"
              value: "Bell.caf"
            - label: "Bubble Pop"
              value: "Bubble-Pop.caf"
            - label: "Clear Announce"
              value: "Clear-Announce.caf"
            - label: "Confirmation"
              value: "Confirmation.caf"
            - label: "Correct Answer"
              value: "Correct-Answer.caf"
            - label: "Correct Answer Reward"
              value: "Correct-Answer-Reward.caf"
            - label: "Digital Quick"
              value: "Digital-Quick.caf"
            - label: "Doorbell Single"
              value: "Doorbell-Single.caf"
            - label: "Doorbell Tone"
              value: "Doorbell-Tone.caf"
            - label: "Dry Pop"
              value: "Dry-Pop.caf"
            - label: "Elevator Tone"
              value: "Elevator-Tone.caf"
            - label: "Gaming Lock"
              value: "Gaming-Lock.caf"
            - label: "Guitar Alert"
              value: "Guitar-Alert.caf"
            - label: "Happy Bells"
              value: "Happy-Bells.caf"
            - label: "Interface Back"
              value: "Interface-Back.caf"
            - label: "Interface Remove"
              value: "Interface-Remove.caf"
            - label: "Interface Start"
              value: "Interface-Start.caf"
            - label: "Light Button"
              value: "Light-Button.caf"
            - label: "Long Pop"
              value: "Long-Pop.caf"
            - label: "Magic Marimba"
              value: "Magic-Marimba.caf"
            - label: "Magic Ring"
              value: "Magic-Ring.caf"
            - label: "Option Select"
              value: "Option-Select.caf"
            - label: "Positive"
              value: "Positive.caf"
            - label: "Sci-Fi Click"
              value: "Sci-Fi-Click.caf"
            - label: "Tile Reveal"
              value: "Tile-Reveal.caf"
            - label: "Wrong Answer"
              value: "Wrong-Answer.caf"
    push_type:
      name: Push type
      description: >-
        Alert (the default) shows a notification. Background is a silent
        update with nothing shown: it goes only to a watch that has
        registered itself (never through the iPhone) and plays no sound.
      selector:
        select:
          options:
            - label: "Alert (show a notification)"
              value: "alert"
            - label: "Background (silent update, watch only)"
              value: "background"
    tag:
      name: Tag
      description: >-
        Collapse identifier. Sending a new notification with the same tag
        replaces the previous one instead of stacking.
      example: "front_door_alert"
      selector:
        text:
    group:
      name: Group
      description: >-
        Thread identifier for grouping related notifications together
        in the watch notification center.
      example: "security"
      selector:
        text:
    priority:
      name: Priority
      description: >-
        How strongly the alert interrupts. Passive arrives silently, Active
        (the default) is a normal alert, and Time Sensitive breaks through
        Focus and Do Not Disturb, which suits doorbells and cameras.
      selector:
        select:
          mode: dropdown
          options:
            - label: "Passive (silent delivery)"
              value: "passive"
            - label: "Active (default)"
              value: "active"
            - label: "Time Sensitive (breaks Focus)"
              value: "time-sensitive"
