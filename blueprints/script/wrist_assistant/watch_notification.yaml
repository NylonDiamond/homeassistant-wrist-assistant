blueprint:
  name: "Watch Notification"
  author: "Wrist Assistant"
  homeassistant:
    min_version: "2024.8.0"
  source_url: "https://github.com/NylonDiamond/homeassistant-wrist-assistant/blob/main/blueprints/script/wrist_assistant/watch_notification.yaml"
  description: >
    Send push notifications to your Apple Watch with smart entity
    buttons. Pick up to 4 entities — each becomes a button that
    knows how to control itself:

    - Lights, switches, fans, covers: tap to toggle

    - Locks, alarms: hold to confirm

    - Lights, covers, fans, climate: double-tap for presets

    Leave button slots empty to skip them. A notification with no
    buttons shows as info-only (title + message).
  domain: script
  input:
    title:
      name: Title
      description: Optional title displayed above the message.
      default: ""
      selector:
        text:
    message:
      name: Message
      description: Notification body text.
      selector:
        text:
          multiline: true
    section_button_1:
      name: Button 1
      icon: mdi:gesture-tap-button
      collapsed: false
      input:
        button_1_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_1_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:
        button_1_icon:
          name: Icon (SF Symbol)
          description: >
            SF Symbol name shown on the button. Pick a preset below or
            type any SF Symbol name (e.g. "lightswitch.on.fill"). To
            browse all available icons, open the Wrist Assistant iOS app
            → Settings → Icon Search. Select "No icon" to clear.
          default: "none"
          selector:
            select:
              mode: dropdown
              custom_value: true
              options: &icon_options
                - label: "No icon"
                  value: "none"
                - label: "Lock (lock.fill)"
                  value: "lock.fill"
                - label: "Unlock (lock.open.fill)"
                  value: "lock.open.fill"
                - label: "Lightbulb (lightbulb.fill)"
                  value: "lightbulb.fill"
                - label: "Power (power)"
                  value: "power"
                - label: "Fan (fan.fill)"
                  value: "fan.fill"
                - label: "Thermometer (thermometer.medium)"
                  value: "thermometer.medium"
                - label: "Snowflake (snowflake)"
                  value: "snowflake"
                - label: "Flame (flame.fill)"
                  value: "flame.fill"
                - label: "Door Open (door.left.hand.open)"
                  value: "door.left.hand.open"
                - label: "Door Closed (door.left.hand.closed)"
                  value: "door.left.hand.closed"
                - label: "Garage (door.garage.open)"
                  value: "door.garage.open"
                - label: "Car (car.fill)"
                  value: "car.fill"
                - label: "Camera (camera.fill)"
                  value: "camera.fill"
                - label: "Bell (bell.fill)"
                  value: "bell.fill"
                - label: "Bell Slash (bell.slash.fill)"
                  value: "bell.slash.fill"
                - label: "Shield (shield.fill)"
                  value: "shield.fill"
                - label: "Alarm (light.beacon.max.fill)"
                  value: "light.beacon.max.fill"
                - label: "Speaker (speaker.wave.2.fill)"
                  value: "speaker.wave.2.fill"
                - label: "Speaker Mute (speaker.slash.fill)"
                  value: "speaker.slash.fill"
                - label: "Play (play.fill)"
                  value: "play.fill"
                - label: "Pause (pause.fill)"
                  value: "pause.fill"
                - label: "Stop (stop.fill)"
                  value: "stop.fill"
                - label: "Forward (forward.fill)"
                  value: "forward.fill"
                - label: "House (house.fill)"
                  value: "house.fill"
                - label: "Moon (moon.fill)"
                  value: "moon.fill"
                - label: "Sun (sun.max.fill)"
                  value: "sun.max.fill"
                - label: "Drop (drop.fill)"
                  value: "drop.fill"
                - label: "Bolt (bolt.fill)"
                  value: "bolt.fill"
                - label: "WiFi (wifi)"
                  value: "wifi"
                - label: "Battery Full (battery.100)"
                  value: "battery.100"
                - label: "Location (location.fill)"
                  value: "location.fill"
                - label: "Person (person.fill)"
                  value: "person.fill"
                - label: "Gear (gearshape.fill)"
                  value: "gearshape.fill"
                - label: "Checkmark (checkmark.circle.fill)"
                  value: "checkmark.circle.fill"
                - label: "Xmark (xmark.circle.fill)"
                  value: "xmark.circle.fill"
                - label: "Arrow Up (arrow.up.circle.fill)"
                  value: "arrow.up.circle.fill"
                - label: "Arrow Down (arrow.down.circle.fill)"
                  value: "arrow.down.circle.fill"
                - label: "Blinds Open (blinds.horizontal.open)"
                  value: "blinds.horizontal.open"
                - label: "Blinds Closed (blinds.horizontal.closed)"
                  value: "blinds.horizontal.closed"
                - label: "Window (window.vertical.open)"
                  value: "window.vertical.open"

    section_button_2:
      name: Button 2
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_2_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_2_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:
        button_2_icon:
          name: Icon (SF Symbol)
          description: >
            SF Symbol name shown on the button. Pick a preset or type
            any name. Browse all icons in the iOS app → Settings →
            Icon Search. Select "No icon" to clear.
          default: "none"
          selector:
            select:
              mode: dropdown
              custom_value: true
              options: *icon_options

    section_button_3:
      name: Button 3
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_3_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_3_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:
        button_3_icon:
          name: Icon (SF Symbol)
          description: >
            SF Symbol name shown on the button. Pick a preset or type
            any name. Browse all icons in the iOS app → Settings →
            Icon Search. Select "No icon" to clear.
          default: "none"
          selector:
            select:
              mode: dropdown
              custom_value: true
              options: *icon_options

    section_button_4:
      name: Button 4
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        button_4_entity:
          name: Entity
          description: >
            Pick the entity this button controls. The watch shows its
            name and current state automatically.
          default: ""
          selector:
            entity:
        button_4_label:
          name: Label
          description: >
            Custom text for the button. Leave blank to use the
            entity's name.
          default: ""
          selector:
            text:
        button_4_icon:
          name: Icon (SF Symbol)
          description: >
            SF Symbol name shown on the button. Pick a preset or type
            any name. Browse all icons in the iOS app → Settings →
            Icon Search. Select "No icon" to clear.
          default: "none"
          selector:
            select:
              mode: dropdown
              custom_value: true
              options: *icon_options

    section_behavior:
      name: Button Behavior
      icon: mdi:gesture-tap
      collapsed: true
      input:
        auto_dismiss:
          name: Auto-Dismiss
          description: >
            Dismiss the notification automatically after any button tap
            succeeds. When off (default), the notification stays visible
            with a checkmark on the tapped button.
          default: false
          selector:
            boolean:

    section_options:
      name: Options
      icon: mdi:tune
      collapsed: true
      input:
        priority:
          name: Priority
          description: >
            Interruption level. Passive delivers silently, Active is the
            default, Time Sensitive breaks through Focus/DND, Critical
            overrides mute.
          default: "active"
          selector:
            select:
              mode: dropdown
              options:
                - label: "Passive (silent delivery)"
                  value: "passive"
                - label: "Active (default)"
                  value: "active"
                - label: "Time Sensitive (breaks Focus)"
                  value: "time-sensitive"
                - label: "Critical (overrides mute)"
                  value: "critical"
        sound:
          name: Sound
          description: >
            Notification sound. Preview sounds at
            mixkit.co/free-sound-effects/notification/ or in the iOS app
            under Settings > Notification Sounds.
          default: "default"
          selector:
            select:
              mode: dropdown
              custom_value: true
              options:
                - label: "Default sound"
                  value: "default"
                - label: "Silent"
                  value: ""
                - label: "Access Allowed"
                  value: "Access-Allowed.caf"
                - label: "Arabian Harp"
                  value: "Arabian-Harp.caf"
                - label: "ATM Keypress"
                  value: "ATM-Keypress.caf"
                - label: "Bell"
                  value: "Bell.caf"
                - label: "Bubble Pop"
                  value: "Bubble-Pop.caf"
                - label: "Clear Announce"
                  value: "Clear-Announce.caf"
                - label: "Confirmation"
                  value: "Confirmation.caf"
                - label: "Correct Answer"
                  value: "Correct-Answer.caf"
                - label: "Correct Answer Reward"
                  value: "Correct-Answer-Reward.caf"
                - label: "Digital Quick"
                  value: "Digital-Quick.caf"
                - label: "Doorbell Single"
                  value: "Doorbell-Single.caf"
                - label: "Doorbell Tone"
                  value: "Doorbell-Tone.caf"
                - label: "Dry Pop"
                  value: "Dry-Pop.caf"
                - label: "Elevator Tone"
                  value: "Elevator-Tone.caf"
                - label: "Gaming Lock"
                  value: "Gaming-Lock.caf"
                - label: "Guitar Alert"
                  value: "Guitar-Alert.caf"
                - label: "Happy Bells"
                  value: "Happy-Bells.caf"
                - label: "Interface Back"
                  value: "Interface-Back.caf"
                - label: "Interface Remove"
                  value: "Interface-Remove.caf"
                - label: "Interface Start"
                  value: "Interface-Start.caf"
                - label: "Light Button"
                  value: "Light-Button.caf"
                - label: "Long Pop"
                  value: "Long-Pop.caf"
                - label: "Magic Marimba"
                  value: "Magic-Marimba.caf"
                - label: "Magic Ring"
                  value: "Magic-Ring.caf"
                - label: "Option Select"
                  value: "Option-Select.caf"
                - label: "Positive"
                  value: "Positive.caf"
                - label: "Sci-Fi Click"
                  value: "Sci-Fi-Click.caf"
                - label: "Tile Reveal"
                  value: "Tile-Reveal.caf"
                - label: "Wrong Answer"
                  value: "Wrong-Answer.caf"
        target:
          name: Target Watch
          description: >
            Watch to send to. Leave empty to send to all registered watches.
          default: ""
          selector:
            device:
              filter:
                - integration: wrist_assistant
                  model: Apple Watch
        tag:
          name: Tag
          description: >
            Collapse key — a new notification with the same tag replaces the
            previous one instead of stacking. For example, set tag to
            "front_door" on a door-open alert so repeated opens show only
            the latest notification rather than piling up.
          default: ""
          selector:
            text:
        group:
          name: Group
          description: >
            Groups related notifications together in the watch notification
            center. For example, two scripts both using group "motion" will
            bundle into a single expandable stack instead of appearing as
            separate entries.
          default: ""
          selector:
            text:

mode: parallel
max: 10

sequence:
  - variables:
      bp_message: !input message
      bp_title: !input title
      bp_b1_entity: !input button_1_entity
      bp_b1_label: !input button_1_label
      bp_b1_icon: !input button_1_icon
      bp_b2_entity: !input button_2_entity
      bp_b2_label: !input button_2_label
      bp_b2_icon: !input button_2_icon
      bp_b3_entity: !input button_3_entity
      bp_b3_label: !input button_3_label
      bp_b3_icon: !input button_3_icon
      bp_b4_entity: !input button_4_entity
      bp_b4_label: !input button_4_label
      bp_b4_icon: !input button_4_icon
      bp_auto_dismiss: !input auto_dismiss
      bp_priority: !input priority
      bp_sound: !input sound
      bp_target_device: !input target
      bp_tag: !input tag
      bp_group: !input group
  - action: wrist_assistant.send_notification
    data: >
      {%- set d = namespace(items=[("message", bp_message), ("priority", bp_priority)]) -%}
      {%- if bp_title %}{%- set d.items = d.items + [("title", bp_title)] -%}{%- endif -%}
      {%- if bp_sound %}{%- set d.items = d.items + [("sound", bp_sound)] -%}{%- endif -%}
      {%- if bp_target_device -%}
        {%- set ids = device_attr(bp_target_device, 'identifiers') | list -%}
        {%- if ids %}{%- set d.items = d.items + [("target", ids[0][1] | replace('watch_', ''))] -%}{%- endif -%}
      {%- endif -%}
      {%- if bp_tag %}{%- set d.items = d.items + [("tag", bp_tag)] -%}{%- endif -%}
      {%- if bp_group %}{%- set d.items = d.items + [("group", bp_group)] -%}{%- endif -%}
      {%- set extra = namespace(items=[]) -%}
      {%- if bp_auto_dismiss %}{%- set extra.items = extra.items + [("auto_dismiss", true)] -%}{%- endif -%}
      {%- set actions = namespace(list=[]) -%}
      {%- set slots = [
        (bp_b1_entity, bp_b1_label, bp_b1_icon),
        (bp_b2_entity, bp_b2_label, bp_b2_icon),
        (bp_b3_entity, bp_b3_label, bp_b3_icon),
        (bp_b4_entity, bp_b4_label, bp_b4_icon),
      ] -%}
      {%- for eid, btn_label, btn_icon in slots -%}
        {%- if eid -%}
          {%- set a = namespace(items=[("entity_id", eid)]) -%}
          {%- if btn_label %}{%- set a.items = a.items + [("label", btn_label)] -%}{%- endif -%}
          {%- if btn_icon and btn_icon != 'none' %}{%- set a.items = a.items + [("icon", btn_icon)] -%}{%- endif -%}
          {%- set actions.list = actions.list + [dict(a.items)] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if actions.list %}{%- set d.items = d.items + [("actions", actions.list)] -%}{%- endif -%}
      {%- if extra.items %}{%- set d.items = d.items + [("data", dict(extra.items))] -%}{%- endif -%}
      {{ dict(d.items) }}
