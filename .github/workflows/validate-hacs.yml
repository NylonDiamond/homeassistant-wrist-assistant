name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"

  # The panel bundle and the icon pack are generated files that are committed
  # so a HACS install needs no toolchain. Nothing at install time rebuilds
  # them, so a release whose bundle was never rebuilt ships new Python next to
  # an old screen and says nothing. These two jobs are the net for that.
  frontend-bundle:
    name: Committed bundle matches frontend/src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Rebuild the panel bundle
        working-directory: frontend
        run: npm run build
      - name: Fail if the committed bundle is stale
        run: |
          if ! git diff --exit-code -- custom_components/wrist_assistant/frontend; then
            echo "::error::The committed panel bundle does not match frontend/src."
            echo "::error::Run 'cd frontend && npm run build' and commit the result."
            exit 1
          fi

  icon-digest:
    name: Icon pack digest matches symbol-digest.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the gzip hash with the declared digest
        run: |
          set -euo pipefail
          gz=custom_components/wrist_assistant/frontend/symbol-icons.json.gz
          ts=frontend/src/symbol-digest.ts
          actual=$(sha256sum "$gz" | cut -c1-12)
          declared=$(sed -n 's/.*SYMBOL_DIGEST = "\([^"]*\)".*/\1/p' "$ts")
          echo "gzip:     $actual"
          echo "declared: $declared"
          if [ -z "$declared" ]; then
            echo "::error::Could not read SYMBOL_DIGEST from $ts"
            exit 1
          fi
          if [ "$actual" != "$declared" ]; then
            echo "::error::$ts is stale. The panel would ask for the icon pack by an"
            echo "::error::old digest and browsers would serve a cached copy for a month."
            echo "::error::Re-run build-icons.mjs, then 'npm run build', and commit both."
            exit 1
          fi

  # Catches the import-time trap that only ever shows up in the Supervisor's
  # container log on the box: a decorator stranded on the wrong definition
  # compiles fine and then kills the whole integration at startup.
  module-sanity:
    name: Static module sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest
      # --noconftest: these tests read the modules with `ast` and need no
      # fixtures, but pytest loads tests/conftest.py regardless, and that
      # conftest imports `requests` for the live HTTP suite. Without the flag
      # the job dies on collection (exit 4) on a runner that has only pytest.
      - run: pytest -q --noconftest tests/test_module_ast_sanity.py

  # Only runs for a tag push. HACS shows users the tag, the integration reports
  # manifest.json, and a mismatch makes the update banner lie.
  tag-matches-manifest:
    name: Tag matches manifest version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/wrist_assistant/manifest.json'))['version'])")
          echo "tag:      $tag"
          echo "manifest: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match manifest version $manifest."
            exit 1
          fi
